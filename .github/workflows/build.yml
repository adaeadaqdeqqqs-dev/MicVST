src/audio/MicVSTDeviceManager.h	createAudioDeviceTypes içinde standart WASAPIDeviceMode::shared modunun birinci sıraya, sharedLowLatency modunun ikinci sıraya alınması	Ağır GPU/DPC gecikmelerinde kolayca çatırtı yapan 2 ms'lik mikro tamponlar yerine kararlı 10 ms paylaşımlı WASAPI modunu varsayılan yapar (Düşük Gecikme modu arayüzden yine seçilebilir).
CMakeLists.txt	JUCE Releases üzerinden en güncel 9.0.3 sürümü (olası API farkında otomatik 8.0.15 yedeği ile), C++20 standardı, avrt + winmm kütüphaneleri ve MSVC /O2 /Oi /Ot /arch:AVX2 /fp:fast /Gy /Gw /MP + /OPT:REF /OPT:ICF bayrakları	Modern işlemcilerde AVX2 vektör komutlarını kullanarak VST3 zincirinin ve ses yönlendirme grafiğinin işlemci yükünü en aza indirir.
İndirdiğiniz MicVST.exe dosyasını mevcut kurulumunuzdaki dosyayla değiştirdikten sonra %APPDATA%\MicVST altındaki mevcut eklenti zinciriniz ve ayarlarınız olduğu gibi korunacaktır.





