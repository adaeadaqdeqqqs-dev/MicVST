nisesimadao/MicVST Çatalında Eklenen Teknik Yenilikler
nisesimadao/MicVST deposunda ana projeden ayrılan 22 commit boyunca eklenen başlıca bileşenler şunlardır:

Yerleşik Gerçek Zamanlı DSP Efektleri (feat: add built-in realtime voice effects, feat: add modulation and space built-in DSP): Harici bir VST3 eklentisi indirmeye gerek kalmadan doğrudan uygulama içinden kullanılabilen AutoTune, Pitch Shift, Deep Voice, Wah / Auto Wah, Unison / Chorus, Delay, Reverb, Bitcrusher, Robot ve Radio dahil 11 dahili ses işleme modülü içerir.

16'lı Ses Panosu / Audio Pads (feat: add Audio Pads soundboard (#8)): Sürükle-bırak ile ses dosyası yüklenebilen, döngü (Loop) ve yumuşak geçiş (Fade) ayarlarına sahip, küresel kısayol tuşlarıyla (Global Hotkeys) tetiklenebilen 16 adet ses pedi sunar; her bir pedin sesi efekt zinciri öncesine (Pre-FX), sonrasına (Post-FX) veya yalnızca kulaklık izleme çıkışına (Output 2) ayrı ayrı yönlendirilebilir.

İkinci Ses Çıkışı ile Kulaklık İzleme (feat: add configurable Output2 monitoring): philipz794/MicVST yalnızca sanal kabloya (Discord, OBS veya Zoom için) ses gönderirken, bu çatalda işlenen sesi veya ses panosu efektlerini aynı anda kendi fiziksel kulaklığınızdan duymanızı sağlayan bağımsız bir Output 2 yönlendirmesi bulunur.

WaveRT Sürücü Yaması ve WDK Araçları (driver: add render-to-microphone WaveRT routing patch, build: add WDK driver build helper): driver/ ve tools/ dizinleri altında Windows Driver Kit (WDK) derleme yardımcıları ve çıkış sesini doğrudan mikrofon girişine yönlendiren özel WaveRT sanal sürücü yamaları yer alır.

Otomatik VB-Cable Kurulumu (feat: use signed VB-CABLE backend with one-click installer, installer: add Windows startup option): installer/ klasöründeki Inno Setup betikleri sayesinde imzalı VB-Cable sürücüsünü ve Windows başlangıç ayarlarını tek seferde yapılandıran hazır kurulum paketi sağlar.

