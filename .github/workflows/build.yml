nisesimadao/MicVST, Philip Zimmermann tarafından geliştirilen orijinal philipz794/MicVST projesinin 22 commit ilerisinde olan genişletilmiş bir çatalıdır (fork). Orijinal proje yalnızca fiziksel mikrofon sesini harici VST3 eklentilerinden geçirip sanal ses kablosuna aktaran minimalist bir Windows sistem tepsisi (tray) uygulamasıyken, nisesimadao sürümü projeye 11 dahili DSP ses efekti, 16'lı ses panosu (Soundboard), ikinci çıkıştan kulaklık izleme (Output 2) ve tek tıkla kurulum paketi ekler.

