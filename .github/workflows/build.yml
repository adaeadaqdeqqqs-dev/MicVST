name: Build MicVST Ultra-Stable (Gaming Edition)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      juce_version:
        description: 'JUCE Surumu (9.0.3 en guncel; uyumsuzluk durumunda otomatik 8.0.15 yedeklenir)'
        required: false
        default: '9.0.3'
        type: choice
        options:
          - '9.0.3'
          - '8.0.15'
          - '8.0.13'

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 Ultra-Stable Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write Ultra-Stable Gaming Mode Patcher
        shell: bash
        run: |
          cat << 'EOF' > apply_ultra_stable_patches.py
          #!/usr/bin/env python3
          """
          MicVST Ultra-Stable Gaming Mode Patcher
          Applies real-time audio hardening, Windows 11 EcoQoS/Power Throttling bypass,
          MMCSS Pro Audio thread elevation, ScopedNoDenormals, NaN/spike protection,
          jitter-safe WASAPI shared mode ordering, and MSVC AVX2 optimizations.
          """

          import pathlib
          import re
          import sys


          def patch_cmake(repo_root: pathlib.Path, juce_tag: str = "9.0.3") -> None:
              cmake_path = repo_root / "CMakeLists.txt"
              text = cmake_path.read_text(encoding="utf-8")

              # 1. Update JUCE GIT_TAG
              text, n_tag = re.subn(
                  r"(GIT_TAG\s+)([0-9]+\.[0-9]+\.[0-9]+)",
                  rf"\g<1>{juce_tag}",
                  text,
                  count=1,
              )
              print(f"[CMakeLists.txt] Updated JUCE GIT_TAG to {juce_tag} (matches: {n_tag})")

              # 2. Upgrade C++ standard to C++20 if cxx_std_17 is present
              text = text.replace("cxx_std_17", "cxx_std_20")

              # 3. Add MSVC Release AVX2 & fast-math compiler/linker optimizations
              msvc_opt_block = """if(MSVC)
              add_compile_options(/utf-8 /MP)
              add_compile_options(
                  "$<$<CONFIG:Release>:/O2>"
                  "$<$<CONFIG:Release>:/Oi>"
                  "$<$<CONFIG:Release>:/Ot>"
                  "$<$<CONFIG:Release>:/arch:AVX2>"
                  "$<$<CONFIG:Release>:/fp:fast>"
                  "$<$<CONFIG:Release>:/Gy>"
                  "$<$<CONFIG:Release>:/Gw>"
              )
              add_link_options(
                  "$<$<CONFIG:Release>:/OPT:REF>"
                  "$<$<CONFIG:Release>:/OPT:ICF>"
              )"""
              if "/arch:AVX2" not in text:
                  text, n_msvc = re.subn(
                      r"if\s*\(\s*MSVC\s*\)\s*\n\s*add_compile_options\s*\(\s*/utf-8\s*\)",
                      msvc_opt_block,
                      text,
                      count=1,
                  )
                  print(f"[CMakeLists.txt] Injected MSVC AVX2/Release flags (matches: {n_msvc})")

              # 4. Link Windows MMCSS (avrt) and high-res timer (winmm) libraries
              if "target_link_libraries(MicVST PRIVATE avrt winmm)" not in text:
                  text += """

          # --- Ultra-Stable Gaming Mode: Windows MMCSS (avrt) & High-Resolution Timer (winmm) ---
          if(WIN32)
              target_link_libraries(MicVSTCore PUBLIC avrt winmm)
              target_link_libraries(MicVST PRIVATE avrt winmm)
          endif()
          """
                  print("[CMakeLists.txt] Linked avrt and winmm for Windows MMCSS & 1ms scheduler timer")

              cmake_path.write_text(text, encoding="utf-8")


          def patch_main_cpp(repo_root: pathlib.Path) -> None:
              main_path = repo_root / "src" / "Main.cpp"
              text = main_path.read_text(encoding="utf-8")

              if "MicVSTUltraStable" in text:
                  print("[src/Main.cpp] Already patched, skipping.")
                  return

              # Pure C++ forward declarations placed right after #includes (zero Windows macro pollution)
              forward_decl = """
          namespace MicVSTUltraStable
          {
              void enableGamingFortressProcessMode() noexcept;
              void disableGamingFortressProcessMode() noexcept;
          }
          """

              last_include = list(re.finditer(r"^#include\s+[^\n]+\n(?:#endif\s*\n)?", text, flags=re.MULTILINE))
              if not last_include:
                  raise RuntimeError("Could not find #include statements in src/Main.cpp")
              insert_pos = last_include[-1].end()
              text = text[:insert_pos] + forward_decl + text[insert_pos:]

              # Inject enableGamingFortressProcessMode() inside initialise() right after --scan child check
              init_pattern = re.compile(
                  r"(void\s+initialise\s*\([^)]*\)\s*override\s*\{)",
                  flags=re.MULTILINE,
              )
              scan_return_pattern = re.compile(
                  r"(if\s*\([^)]*--scan[^)]*\)\s*\{[^}]*return\s*;\s*\})",
                  flags=re.DOTALL,
              )

              enable_call = """
                  MicVSTUltraStable::enableGamingFortressProcessMode();
          """
              if scan_return_pattern.search(text):
                  text, n_init = scan_return_pattern.subn(rf"\g<1>\n{enable_call}", text, count=1)
              else:
                  text, n_init = init_pattern.subn(rf"\g<1>\n{enable_call}", text, count=1)

              if n_init == 0:
                  raise RuntimeError("Could not find initialise() in src/Main.cpp")

              # Inject disableGamingFortressProcessMode() in shutdown()
              shutdown_pattern = re.compile(
                  r"(void\s+shutdown\s*\(\s*\)\s*override\s*\{)",
                  flags=re.MULTILINE,
              )
              disable_call = """
                  MicVSTUltraStable::disableGamingFortressProcessMode();
          """
              text, n_shut = shutdown_pattern.subn(rf"\g<1>\n{disable_call}", text, count=1)

              # Append Windows API implementation at the very bottom of src/Main.cpp
              win_impl_bottom = """

          #if JUCE_WINDOWS || defined(_WIN32)
          #ifndef WIN32_LEAN_AND_MEAN
          #define WIN32_LEAN_AND_MEAN
          #endif
          #ifndef NOMINMAX
          #define NOMINMAX
          #endif
          #include <windows.h>
          #include <mmsystem.h>

          namespace MicVSTUltraStable
          {
              void enableGamingFortressProcessMode() noexcept
              {
                  HANDLE hProcess = ::GetCurrentProcess();

                  // 1. Elevate process priority so background tray mode never starves under 100% CPU/GPU gaming load
                  if (! ::SetPriorityClass (hProcess, HIGH_PRIORITY_CLASS))
                      ::SetPriorityClass (hProcess, ABOVE_NORMAL_PRIORITY_CLASS);

                  // 2. Keep dynamic priority boost active for real-time audio wakeups
                  ::SetProcessPriorityBoost (hProcess, FALSE);

                  // 3. Disable Windows 10/11 EcoQoS (Power Throttling) so Windows Thread Director
                  //    never migrates MicVST to E-Cores (Efficiency Cores) or throttles clock speed in the system tray
                  #if defined(PROCESS_POWER_THROTTLING_CURRENT_VERSION)
                  PROCESS_POWER_THROTTLING_STATE powerThrottling {};
                  powerThrottling.Version = PROCESS_POWER_THROTTLING_CURRENT_VERSION;
                  powerThrottling.ControlMask = PROCESS_POWER_THROTTLING_EXECUTION_SPEED
                  #if defined(PROCESS_POWER_THROTTLING_IGNORE_TIMER_RESOLUTION)
                                              | PROCESS_POWER_THROTTLING_IGNORE_TIMER_RESOLUTION
                  #endif
                                              ;
                  powerThrottling.StateMask = 0; // 0 = Disable throttling completely
                  ::SetProcessInformation (hProcess, ProcessPowerThrottling, &powerThrottling, sizeof (powerThrottling));
                  #endif

                  // 4. Lock kernel scheduler timer resolution to 1 ms to eliminate WASAPI wakeup jitter
                  ::timeBeginPeriod (1);
              }

              void disableGamingFortressProcessMode() noexcept
              {
                  ::timeEndPeriod (1);
              }
          }
          #else
          namespace MicVSTUltraStable
          {
              void enableGamingFortressProcessMode() noexcept {}
              void disableGamingFortressProcessMode() noexcept {}
          }
          #endif
          """
              text += win_impl_bottom
              print(f"[src/Main.cpp] Patched initialise() ({n_init}) and shutdown() ({n_shut}) with EcoQoS & HIGH_PRIORITY_CLASS protection")
              main_path.write_text(text, encoding="utf-8")


          def patch_audio_engine_cpp(repo_root: pathlib.Path) -> None:
              ae_path = repo_root / "src" / "audio" / "AudioEngine.cpp"
              text = ae_path.read_text(encoding="utf-8")

              if "hardenCurrentAudioThreadOnce" in text:
                  print("[src/audio/AudioEngine.cpp] Already patched, skipping.")
                  return

              header_injection = """#include "audio/AudioEngine.h"

          namespace MicVSTUltraStable
          {
              void hardenCurrentAudioThreadOnce() noexcept;
              void sanitizeOutputChannels (float* const* outputChannelData, int numOutputChannels, int numSamples) noexcept;
          }
          """

              text, n_hdr = re.subn(
                  r'#include\s+"audio/AudioEngine\.h"',
                  header_injection,
                  text,
                  count=1,
              )
              if n_hdr == 0:
                  raise RuntimeError('Could not find #include "audio/AudioEngine.h" in src/audio/AudioEngine.cpp')

              # Inject ScopedNoDenormals + hardenCurrentAudioThreadOnce() at start of audioDeviceIOCallbackWithContext
              callback_entry_injection = r"""\g<1>
              const juce::ScopedNoDenormals noDenormals;
              MicVSTUltraStable::hardenCurrentAudioThreadOnce();
          """
              text, n_cb = re.subn(
                  r"(void\s+AudioEngine::audioDeviceIOCallbackWithContext\s*\([^)]*\)\s*\{)",
                  callback_entry_injection,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if n_cb == 0:
                  raise RuntimeError("Could not find AudioEngine::audioDeviceIOCallbackWithContext in src/audio/AudioEngine.cpp")

              # Inject NaN / Inf / digital spike guard right after player.audioDeviceIOCallbackWithContext(...)
              sanitizer_injection = r"""\g<1>
              MicVSTUltraStable::sanitizeOutputChannels (outputChannelData, numOutputChannels, numSamples);
          """
              text, n_san = re.subn(
                  r"(player\.audioDeviceIOCallbackWithContext\s*\([^;]+;\s*)",
                  sanitizer_injection,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )

              bottom_impl = """

          #include <cmath>
          #if JUCE_WINDOWS || defined(_WIN32)
          #ifndef WIN32_LEAN_AND_MEAN
          #define WIN32_LEAN_AND_MEAN
          #endif
          #ifndef NOMINMAX
          #define NOMINMAX
          #endif
          #include <windows.h>
          #include <avrt.h>

          namespace MicVSTUltraStable
          {
              namespace
              {
                  struct ScopedAudioThreadHardener
                  {
                      HANDLE mmcssHandle = nullptr;

                      ScopedAudioThreadHardener() noexcept
                      {
                          DWORD taskIndex = 0;
                          mmcssHandle = ::AvSetMmThreadCharacteristicsW (L"Pro Audio", &taskIndex);
                          if (mmcssHandle != nullptr)
                              ::AvSetMmThreadPriority (mmcssHandle, AVRT_PRIORITY_CRITICAL);
                          else
                              ::SetThreadPriority (::GetCurrentThread(), THREAD_PRIORITY_TIME_CRITICAL);

                          ::SetThreadPriorityBoost (::GetCurrentThread(), FALSE);

                          #if defined(THREAD_POWER_THROTTLING_CURRENT_VERSION)
                          THREAD_POWER_THROTTLING_STATE threadThrottling {};
                          threadThrottling.Version = THREAD_POWER_THROTTLING_CURRENT_VERSION;
                          threadThrottling.ControlMask = THREAD_POWER_THROTTLING_EXECUTION_SPEED;
                          threadThrottling.StateMask = 0;
                          ::SetThreadInformation (::GetCurrentThread(), ThreadPowerThrottling, &threadThrottling, sizeof (threadThrottling));
                          #endif
                      }

                      ~ScopedAudioThreadHardener() noexcept
                      {
                          if (mmcssHandle != nullptr)
                              ::AvRevertMmThreadCharacteristics (mmcssHandle);
                      }
                  };
              }

              void hardenCurrentAudioThreadOnce() noexcept
              {
                  static thread_local ScopedAudioThreadHardener hardener;
                  (void) hardener;
              }
          }
          #else
          namespace MicVSTUltraStable
          {
              void hardenCurrentAudioThreadOnce() noexcept {}
          }
          #endif

          namespace MicVSTUltraStable
          {
              void sanitizeOutputChannels (float* const* outputChannelData, int numOutputChannels, int numSamples) noexcept
              {
                  if (outputChannelData == nullptr || numOutputChannels <= 0 || numSamples <= 0)
                      return;

                  for (int ch = 0; ch < numOutputChannels; ++ch)
                  {
                      if (float* dst = outputChannelData[ch])
                      {
                          for (int i = 0; i < numSamples; ++i)
                          {
                              float s = dst[i];
                              if (! std::isfinite (s))
                                  s = 0.0f;
                              else if (s > 1.25f)
                                  s = 1.25f;
                              else if (s < -1.25f)
                                  s = -1.25f;
                              dst[i] = s;
                          }
                      }
                  }
              }
          }
          """
              text += bottom_impl
              print(f"[src/audio/AudioEngine.cpp] Patched callback with ScopedNoDenormals + MMCSS Pro Audio ({n_cb}) and output glitch guard ({n_san})")
              ae_path.write_text(text, encoding="utf-8")


          def patch_device_manager_h(repo_root: pathlib.Path) -> None:
              dm_path = repo_root / "src" / "audio" / "MicVSTDeviceManager.h"
              text = dm_path.read_text(encoding="utf-8")

              # Prioritize standard jitter-resistant WASAPIDeviceMode::shared first so heavy GPU DPC latency
              # does not underrun tiny IAudioClient3 micro-buffers by default, while keeping sharedLowLatency available.
              new_create_types = """void createAudioDeviceTypes (juce::OwnedArray<juce::AudioIODeviceType>& types) override
              {
                  if (auto* shared = juce::AudioIODeviceType::createAudioIODeviceType_WASAPI (
                                         juce::WASAPIDeviceMode::shared))
                      types.add (shared);
                  if (auto* ll = juce::AudioIODeviceType::createAudioIODeviceType_WASAPI (
                                     juce::WASAPIDeviceMode::sharedLowLatency))
                      types.add (ll);
              }"""

              text, n_dm = re.subn(
                  r"void\s+createAudioDeviceTypes\s*\(\s*juce::OwnedArray<juce::AudioIODeviceType>&\s*types\s*\)\s*override\s*\{[^}]*\}",
                  new_create_types,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              print(f"[src/audio/MicVSTDeviceManager.h] Reordered WASAPI modes for gaming stability (matches: {n_dm})")
              dm_path.write_text(text, encoding="utf-8")


          def main() -> None:
              repo_root = pathlib.Path(".")
              juce_tag = sys.argv[1] if len(sys.argv) > 1 else "9.0.3"
              print(f"=== Applying MicVST Ultra-Stable Gaming Mode Patches (JUCE {juce_tag}) ===")
              patch_cmake(repo_root, juce_tag=juce_tag)
              patch_main_cpp(repo_root)
              patch_audio_engine_cpp(repo_root)
              patch_device_manager_h(repo_root)
              print("=== All patches applied successfully! ===")


          if __name__ == "__main__":
              main()
          EOF

      - name: Apply Ultra-Stable Gaming Patches & Build (with Automatic JUCE Fallback)
        shell: pwsh
        run: |
          $RequestedJuce = "${{ github.event.inputs.juce_version }}"
          if ([string]::IsNullOrWhiteSpace($RequestedJuce)) {
              $RequestedJuce = "9.0.3"
          }

          Write-Host ">>> Applying Ultra-Stable patches with JUCE $RequestedJuce..."
          python apply_ultra_stable_patches.py $RequestedJuce

          Write-Host ">>> Configuring CMake (x64)..."
          cmake -S . -B build -A x64

          Write-Host ">>> Building MicVST & MicVSTTests (Release x64)..."
          cmake --build build --config Release --target MicVST MicVSTTests --parallel
          if ($LASTEXITCODE -ne 0 -and $RequestedJuce -ne "8.0.15") {
              Write-Warning "JUCE $RequestedJuce build encountered an API difference. Automatically falling back to latest JUCE 8 (8.0.15)..."
              Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
              git checkout -- CMakeLists.txt src/Main.cpp src/audio/AudioEngine.cpp src/audio/MicVSTDeviceManager.h
              python apply_ultra_stable_patches.py 8.0.15
              cmake -S . -B build -A x64
              cmake --build build --config Release --target MicVST MicVSTTests --parallel
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Run Unit Tests
        shell: pwsh
        run: |
          .\build\MicVSTTests_artefacts\Release\MicVSTTests.exe

      - name: Generate SHA-256 Checksum & Package Portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\MicVST_artefacts\Release\MicVST.exe" "dist\MicVST.exe"
          $hash = (Get-FileHash "dist\MicVST.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  MicVST.exe" | Out-File -FilePath "dist\MicVST.exe.sha256.txt" -Encoding utf8
          Write-Host "SHA-256: $hash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### MicVST Ultra-Stable (Gaming Edition) Derleme Ozeti"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Dosya:** MicVST.exe (Tasinabilir, statik derlenmis x64)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **SHA-256:** $hash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Aktif Korumalar:** Windows 11 EcoQoS / Guc Kisma Engeli, HIGH_PRIORITY_CLASS, MMCSS Pro Audio (AVRT_PRIORITY_CRITICAL), 1ms Zamanlayici Kilidi (timeBeginPeriod), ScopedNoDenormals, NaN/Spike Cikis Korumasi, AVX2 SIMD"

      - name: Upload MicVST Ultra-Stable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicVST-UltraStable-x64
          path: |
            dist/MicVST.exe
            dist/MicVST.exe.sha256.txt
          if-no-files-found: error
